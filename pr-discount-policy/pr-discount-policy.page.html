<ion-header [translucent]="true">
	<app-toolbar [page]="this"></app-toolbar>
</ion-header>

<ion-content [fullscreen]="true" appScrollbarTheme class="left scrollx" forceOverscroll="false">
	<app-page-title class="ion-padding safe-max-width" [pageConfig]="pageConfig"></app-page-title>

	<div class="safe-max-width">
		<app-data-table
			class="box-shadow responsive"
			[rows]="items"
			[trackBy]="'Id'"
			[(selectedRows)]="selectedItems"
			[showSpinner]="pageConfig.showSpinner"
			[showFilter]="pageConfig.isShowSearch"
			[(query)]="query"
			(dataInfinite)="loadData($event)"
			(filter)="onDatatableFilter($event)"
			(sort)="onSort($event)"
			(selectedRowsChange)="showCommandBySelectedRows($event)"
		>
			<datatable-column [checkbox]="true" name=""></datatable-column>
			<datatable-column class="col-id" name="#" property="Id" [navLink]="pageConfig.pageName"></datatable-column>
			<datatable-column class="cell" name="Discount name" property="Name" [canSort]="false" [navLink]="pageConfig.pageName"></datatable-column>
			<datatable-column class="cell" name="Time application" property="FromDate" [canSort]="false" [canFilter]="false">
				<ng-template let-i="row" datatable-cell-template>
					<ion-text color="primary">{{i.FromDate | date: 'dd/MM/yyyy'}} -> {{i.ToDate | date: 'dd/MM/yyyy'}}</ion-text>
				</ng-template>
			</datatable-column>
			<datatable-column class="cell" name="Status" property="Status" [canSort]="false" [canFilter]="false"></datatable-column>
		</app-data-table>
	</div>

	<div class="ion-padding"></div>
</ion-content>
